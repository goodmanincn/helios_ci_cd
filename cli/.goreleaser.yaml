# helios CLI 发布配置 (M8 T8.3.5)
# 用法: cd cli && goreleaser release --clean
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: helios
    main: ./cmd/helios
    binary: helios
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/helios-cicd/helios/cli/internal/cmd.Version={{.Version}}
      - -X main.BuildTime={{.Date}}
      - -X main.GitCommit={{.Commit}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs"
      - "^test"

brews:
  - name: helios
    repository:
      owner: helios-cicd
      name: homebrew-tap
    directory: Formula
    homepage: https://docs.helios.io
    description: Helios CI/CD 平台命令行工具
    license: Apache-2.0
    install: |
      bin.install "helios"
    test: |
      system "#{bin}/helios", "--version"

release:
  github:
    owner: helios-cicd
    name: helios
  draft: false
  prerelease: auto
