name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"  # 每周一 03:00 UTC

jobs:
  gosec:
    name: gosec
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [api, worker, runner, cli]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Run gosec
        uses: securego/gosec@master
        with:
          args: -exclude-dir=vendor ./...
        env:
          GOFLAGS: -mod=mod
        working-directory: ${{ matrix.module }}

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [api, worker, runner, cli]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - working-directory: ${{ matrix.module }}
        run: govulncheck ./...
